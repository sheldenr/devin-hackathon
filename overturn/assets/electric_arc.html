<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root{--foreground:#3c4f63;--ns-accent:#8095ab;--background:#f4f6f8;}
  html,body{margin:0;background:transparent;
    font-family:'Avenir Next','Segoe UI',system-ui,sans-serif;}
  .ns-sg{position:relative;display:inline-flex;margin:19px;}
  .sg-btn{position:relative;z-index:1;border:none;border-radius:6px;
    background:var(--foreground);color:#f4f6f8;padding:10px 24px;
    font:500 14px/1.2 'Avenir Next','Segoe UI',sans-serif;cursor:pointer;
    text-decoration:none;display:inline-flex;align-items:center;
    transition:background .15s;}
  .sg-btn:hover{background:#2f4152;}
  .sg-btn:active{background:#26374a;}
  .sg-btn:focus-visible{outline:2px solid var(--ns-accent);outline-offset:2px;}
  svg.fx{position:absolute;pointer-events:none;overflow:visible;}
  @media (prefers-reduced-motion: reduce){
    .ns-sg-glow,.ns-sg-arc,.ns-sg-spark{opacity:0 !important;transition:none !important;}
    .sg-btn:hover,.sg-btn:focus-visible{
      box-shadow:0 0 14px 0 color-mix(in srgb, var(--ns-accent) 45%, transparent);}
  }
</style>
</head>
<body>
<div class="ns-sg" id="wrap">
  <svg class="fx" id="svg" aria-hidden="true" focusable="false" width="0" height="0"
       style="left:-19px;top:-19px;">
    <defs>
      <filter id="sgjitter" x="-10%" y="-10%" width="120%" height="120%">
        <feTurbulence id="tb" type="fractalNoise" baseFrequency="0.02 0.06"
                      numOctaves="2" seed="7" result="n"/>
        <feDisplacementMap id="dp" in="SourceGraphic" in2="n" scale="2.8"
                      xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </defs>
    <path id="glow" class="ns-sg-glow" fill="none" stroke="var(--ns-accent)"
          stroke-width="5" stroke-linecap="round"
          style="opacity:0.3;filter:blur(3.5px);transition:opacity 200ms ease-out"/>
    <path id="core" fill="none" stroke="var(--foreground)" stroke-width="1.5"
          stroke-linecap="round" filter="url(#sgjitter)"/>
    <path id="arc" class="ns-sg-arc" fill="none" stroke="var(--foreground)"
          stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"
          style="opacity:0;filter:drop-shadow(0 0 4px var(--ns-accent)) drop-shadow(0 0 1.5px var(--ns-accent))"/>
    <path id="spA" class="ns-sg-spark" fill="none" stroke="var(--ns-accent)"
          stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"
          style="opacity:0;filter:drop-shadow(0 0 3px var(--ns-accent))"/>
    <path id="spB" class="ns-sg-spark" fill="none" stroke="var(--ns-accent)"
          stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"
          style="opacity:0;filter:drop-shadow(0 0 3px var(--ns-accent))"/>
  </svg>
  __INNER__
</div>
<script>
"use strict";
// Faithful vanilla port of ns-ui SparkGap (border-electric-arc).
const OUT=5, MARGIN=14, EXT=OUT+MARGIN, RADIUS=10, STROKE_W=1.5, GAP_PX=16,
  NEAR_PX=30, JITTER_MS=150, SPARK_MIN_MS=1000, SPARK_MAX_MS=3000,
  FLASH_MS=110, SPENT_MS=2000, SCALE_IDLE=2.8, SCALE_SPENT=1.1;

const wrap=document.getElementById('wrap'),svg=document.getElementById('svg');
const glow=document.getElementById('glow'),core=document.getElementById('core');
const arc=document.getElementById('arc');
const sparkA=document.getElementById('spA'),sparkB=document.getElementById('spB');
const turb=document.getElementById('tb'),disp=document.getElementById('dp');
const btn=wrap.querySelector('.sg-btn');

const mq=matchMedia('(prefers-reduced-motion: reduce)');
let reduced=mq.matches;
let layout=null,visible=true,mode='idle',near=false;
let gapCur=0,gapTarget=0,sPath=0,seed=7,skipTick=false;
let tweenRaf=0,tweenLast=0,jitterTimer,sparkTimer,flashT1,flashT2;

function applyGlow(){
  glow.style.opacity = mode==='spent' ? '0.12' : (near?'0.55':'0.3');
}
function applyGap(){
  if(!layout)return;
  const P=layout.P;
  if(gapCur<0.6){
    core.removeAttribute('stroke-dasharray');core.removeAttribute('stroke-dashoffset');
    glow.removeAttribute('stroke-dasharray');glow.removeAttribute('stroke-dashoffset');
    arc.style.opacity='0';return;
  }
  const g=gapCur;
  const dash=`${(P-g).toFixed(2)} ${g.toFixed(2)}`;
  const off=(P-sPath-g/2).toFixed(2);
  core.setAttribute('stroke-dasharray',dash);core.setAttribute('stroke-dashoffset',off);
  glow.setAttribute('stroke-dasharray',dash);glow.setAttribute('stroke-dashoffset',off);
  const a=core.getPointAtLength((((sPath-g/2)%P)+P)%P);
  const b=core.getPointAtLength((sPath+g/2)%P);
  const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy)||1;
  const nx=-dy/len,ny=dx/len;
  const j1=(Math.random()-0.5)*5,j2=(Math.random()-0.5)*5;
  arc.setAttribute('d',
    `M ${a.x.toFixed(1)} ${a.y.toFixed(1)}`+
    ` L ${(a.x+dx*0.33+nx*j1).toFixed(1)} ${(a.y+dy*0.33+ny*j1).toFixed(1)}`+
    ` L ${(a.x+dx*0.66+nx*j2).toFixed(1)} ${(a.y+dy*0.66+ny*j2).toFixed(1)}`+
    ` L ${b.x.toFixed(1)} ${b.y.toFixed(1)}`);
  arc.style.opacity=Math.min(1,g/GAP_PX).toFixed(2);
}
function tweenStep(t){
  tweenRaf=0;
  const dt=tweenLast?Math.min(0.05,(t-tweenLast)/1000):1/60;
  tweenLast=t;
  gapCur+=(gapTarget-gapCur)*Math.min(1,dt*16);
  if(Math.abs(gapTarget-gapCur)<0.4)gapCur=gapTarget;
  applyGap();
  if(gapCur!==gapTarget)tweenRaf=requestAnimationFrame(tweenStep);
}
function startTween(){if(!tweenRaf&&gapCur!==gapTarget){tweenLast=0;tweenRaf=requestAnimationFrame(tweenStep);}}

function projectToPerimeter(lx,ly,L){
  const {x,y,w,h,r}=L,q=Math.PI*r/2;
  const edges=[
    {ax:x+r,ay:y,bx:x+w-r,by:y,start:0},
    {ax:x+w,ay:y+r,bx:x+w,by:y+h-r,start:w-2*r+q},
    {ax:x+w-r,ay:y+h,bx:x+r,by:y+h,start:w-2*r+q+(h-2*r)+q},
    {ax:x,ay:y+h-r,bx:x,by:y+r,start:2*(w-2*r)+(h-2*r)+3*q},
  ];
  let bestS=0,bestDist=Infinity;
  for(const e of edges){
    const abx=e.bx-e.ax,aby=e.by-e.ay,len2=abx*abx+aby*aby;
    const t=len2>0?Math.max(0,Math.min(1,((lx-e.ax)*abx+(ly-e.ay)*aby)/len2)):0;
    const px=e.ax+abx*t,py=e.ay+aby*t,d=Math.hypot(lx-px,ly-py);
    if(d<bestDist){bestDist=d;bestS=e.start+t*Math.sqrt(len2);}
  }
  return {s:bestS,dist:bestDist};
}
function onMove(e){
  if(reduced||!layout)return;
  const rect=wrap.getBoundingClientRect();
  if(rect.width<4)return;
  const lx=e.clientX-rect.left+EXT,ly=e.clientY-rect.top+EXT;
  const proj=projectToPerimeter(lx,ly,layout);
  const nowNear=proj.dist<NEAR_PX;
  if(nowNear!==near){near=nowNear;applyGlow();}
  sPath=proj.s*layout.k;
  gapTarget=nowNear?GAP_PX:0;
  if(gapCur>0.6)applyGap();
  startTween();
}

function jitterTick(){
  if(!visible||document.hidden)return;
  skipTick=!skipTick;
  if(mode==='spent'&&skipTick)return;
  seed=(seed+1)%997;
  turb.setAttribute('seed',String(seed));
  turb.setAttribute('baseFrequency',`0.02 ${(0.05+Math.random()*0.04).toFixed(3)}`);
  disp.setAttribute('scale',String(mode==='spent'?SCALE_SPENT:SCALE_IDLE));
}
const startJitter=()=>{if(jitterTimer===undefined&&!reduced)jitterTimer=setInterval(jitterTick,JITTER_MS);};
const stopJitter=()=>{if(jitterTimer!==undefined){clearInterval(jitterTimer);jitterTimer=undefined;}};

function flashPath(el,d){
  el.setAttribute('d',d);el.style.transition='none';el.style.opacity='0.95';
  requestAnimationFrame(()=>{el.style.transition='opacity 220ms ease-out';el.style.opacity='0';});
}
function jaggedBranch(cx,cy,nx,ny){
  let px=cx,py=cy,d=`M ${px.toFixed(1)} ${py.toFixed(1)}`;
  for(let i=0;i<3;i++){
    const step=3+Math.random()*4,jit=(Math.random()-0.5)*5;
    px+=nx*step-ny*jit;py+=ny*step+nx*jit;
    d+=` L ${px.toFixed(1)} ${py.toFixed(1)}`;
  }
  return d;
}
function fireSpark(){
  if(!layout||!visible||document.hidden||reduced||mode==='spent')return;
  const {x,y,w,h,r}=layout,inset=r*0.3;
  const corners=[
    {cx:x+inset,cy:y+inset,dx:-1,dy:-1},{cx:x+w-inset,cy:y+inset,dx:1,dy:-1},
    {cx:x+w-inset,cy:y+h-inset,dx:1,dy:1},{cx:x+inset,cy:y+h-inset,dx:-1,dy:1},
  ];
  const c=corners[Math.floor(Math.random()*4)];
  const nx=c.dx/Math.SQRT2,ny=c.dy/Math.SQRT2;
  flashPath(sparkA,jaggedBranch(c.cx,c.cy,nx,ny));
  if(Math.random()<0.4){
    const rot=(Math.random()<0.5?1:-1)*0.7;
    const fx=nx*Math.cos(rot)-ny*Math.sin(rot),fy=nx*Math.sin(rot)+ny*Math.cos(rot);
    flashPath(sparkB,jaggedBranch(c.cx,c.cy,fx,fy));
  }
}
function scheduleSpark(){sparkTimer=setTimeout(()=>{fireSpark();scheduleSpark();},
  SPARK_MIN_MS+Math.random()*(SPARK_MAX_MS-SPARK_MIN_MS));}
const startSparks=()=>{if(sparkTimer===undefined&&!reduced)scheduleSpark();};
const stopSparks=()=>{if(sparkTimer!==undefined){clearTimeout(sparkTimer);sparkTimer=undefined;}};

function discharge(){
  if(reduced)return;
  clearTimeout(flashT1);clearTimeout(flashT2);mode='idle';
  const fast='opacity 80ms ease-out, stroke-width 80ms ease-out, filter 80ms ease-out';
  core.style.transition=fast;core.style.opacity='1';core.style.strokeWidth='2.6';
  glow.style.transition=fast;glow.style.opacity='1';glow.style.filter='blur(6px)';
  flashT1=setTimeout(()=>{
    mode='spent';disp.setAttribute('scale',String(SCALE_SPENT));
    const settle='opacity 260ms ease-in, stroke-width 260ms ease-in, filter 260ms ease-in';
    core.style.transition=settle;core.style.opacity='0.65';core.style.strokeWidth=String(STROKE_W);
    glow.style.transition=settle;glow.style.filter='blur(3.5px)';applyGlow();
    flashT2=setTimeout(()=>{
      mode='idle';disp.setAttribute('scale',String(SCALE_IDLE));
      core.style.transition='opacity 300ms ease-out';core.style.opacity='1';
      glow.style.transition='opacity 300ms ease-out';applyGlow();
    },SPENT_MS);
  },FLASH_MS);
}

function roundedRectPath(x,y,w,h,r){
  return `M ${x+r} ${y} L ${x+w-r} ${y} A ${r} ${r} 0 0 1 ${x+w} ${y+r}`+
    ` L ${x+w} ${y+h-r} A ${r} ${r} 0 0 1 ${x+w-r} ${y+h}`+
    ` L ${x+r} ${y+h} A ${r} ${r} 0 0 1 ${x} ${y+h-r}`+
    ` L ${x} ${y+r} A ${r} ${r} 0 0 1 ${x+r} ${y} Z`;
}
function resize(){
  const rect=wrap.getBoundingClientRect();
  if(rect.width<4||rect.height<4)return;
  const bw=rect.width+OUT*2,bh=rect.height+OUT*2,sw=bw+MARGIN*2,sh=bh+MARGIN*2;
  svg.setAttribute('width',String(sw));svg.setAttribute('height',String(sh));
  const r=Math.min(RADIUS,bw/2,bh/2);
  const d=roundedRectPath(MARGIN,MARGIN,bw,bh,r);
  glow.setAttribute('d',d);core.setAttribute('d',d);
  const P=core.getTotalLength();
  const analytic=2*(bw-2*r)+2*(bh-2*r)+2*Math.PI*r;
  layout={x:MARGIN,y:MARGIN,w:bw,h:bh,r,P,k:P/analytic};
  applyGap();
}

function applyReduced(){
  if(reduced){
    stopJitter();stopSparks();clearTimeout(flashT1);clearTimeout(flashT2);
    if(tweenRaf)cancelAnimationFrame(tweenRaf);tweenRaf=0;
    gapCur=gapTarget=0;mode='idle';near=false;applyGap();
    core.removeAttribute('filter');core.style.transition='none';
    core.style.opacity='1';core.style.strokeWidth=String(STROKE_W);
    arc.style.opacity='0';sparkA.style.opacity='0';sparkB.style.opacity='0';
  }else{
    core.setAttribute('filter','url(#sgjitter)');applyGlow();
    if(visible){startJitter();startSparks();}
  }
}
mq.addEventListener('change',()=>{reduced=mq.matches;applyReduced();});
new ResizeObserver(resize).observe(wrap);resize();
new IntersectionObserver(en=>{
  visible=en[0]?.isIntersecting??true;
  if(visible&&!reduced){startJitter();startSparks();}else{stopJitter();stopSparks();}
}).observe(wrap);
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden&&!reduced&&visible)jitterTick();});
addEventListener('pointermove',onMove);addEventListener('mousemove',onMove);
btn.addEventListener('pointerdown',discharge);
btn.addEventListener('click',e=>{if(e.detail===0)discharge();});
applyReduced();
if(!reduced&&visible){startJitter();startSparks();}
</script>
</body>
</html>
